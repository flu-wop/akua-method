<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A28"/>
      <stop offset="100%" style="stop-color:#0E0E18"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="rgba(0,0,0,0.2)"/>
  <!-- Bottle shape -->
  <rect x="170" y="130" width="60" height="10" rx="3" fill="url(#bottle)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <rect x="162" y="140" width="76" height="120" rx="8" fill="url(#bottle)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <!-- Label on bottle -->
  <rect x="172" y="175" width="56" height="55" rx="3" fill="rgba(255,255,255,0.15)"/>
  <text x="200" y="197" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="white" opacity="0.9">TH</text>
  <text x="200" y="213" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#B8941E" letter-spacing="1">PERFUME OIL</text>
  <!-- Product name -->
  <text x="200" y="305" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#F5F1E8" letter-spacing="2">The Baddest Man</text>
  <text x="200" y="328" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#B8941E" letter-spacing="3">OUD · DARK LEATHER</text>
  <text x="200" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" letter-spacing="4">AKUA METHOD</text>
</svg>